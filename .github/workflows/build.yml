# CI / release pipeline for Decky Controller
#
# Flow:
#   build   — runs on every push to main, on every pull request and on tags v*:
#             pnpm install (frozen lockfile) -> tsc typecheck -> rollup build -> Python compileall + unittest
#             -> scripts/build-zip.sh --no-build -> upload out/decky-controller.zip as a workflow artifact.
#   release — only for tags v* (needs build): checks that the tag equals "v" + package.json version
#             (fails otherwise, so a mistagged release never ships), downloads the zip produced by the build
#             job and creates/updates the GitHub Release with exactly one asset (decky-controller.zip) and
#             auto-generated release notes.
#
# To cut a release: bump "version" in package.json, commit, `git tag v<version>`, push the tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 9.x — the exact version comes from package.json "packageManager" (pnpm@9.15.9).
      # Do not add a `version:` input here: pnpm/action-setup@v4 fails when both are set and differ.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build frontend
        run: pnpm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python compile + unit tests
        run: python3 -m compileall -q py_modules main.py && python3 -m unittest discover -s tests -v

      - name: Package plugin zip
        run: bash scripts/build-zip.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: decky-controller
          path: out/decky-controller.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${VERSION}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::tag '${TAG}' does not match package.json version 'v${VERSION}'"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: decky-controller
          path: out

      - name: Check release asset
        run: |
          ls -l out
          test -f out/decky-controller.zip
          unzip -l out/decky-controller.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: out/decky-controller.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
