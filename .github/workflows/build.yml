# build: typecheck + rollup + Python tests + zip on every push/PR; release: on tags v* (must equal
# "v" + package.json version) publishes out/decky-controller.zip as the single GitHub Release asset.
# To cut a release: bump "version" in package.json, commit, `git tag v<version>`, push the tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"; a `version:` input here would make action-setup fail
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build frontend
        run: pnpm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python compile + unit tests
        run: python3 -m compileall -q py_modules main.py && python3 -m unittest discover -s tests -v

      - name: Package plugin zip
        run: bash scripts/build-zip.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: decky-controller
          path: out/decky-controller.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${VERSION}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::tag '${TAG}' does not match package.json version 'v${VERSION}'"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: decky-controller
          path: out

      - name: Check release asset
        run: |
          ls -l out
          test -f out/decky-controller.zip
          unzip -l out/decky-controller.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: out/decky-controller.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
